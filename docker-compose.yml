version: '3.8'

services:
  # Local blockchain (Anvil)
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: erc8004-anvil
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        anvil --host 0.0.0.0 --port 8545 --chain-id 31337
    ports:
      - "8545:8545"
    networks:
      - erc8004-network
    environment:
      - FOUNDRY_DISABLE_NIGHTLY_WARNING=1
    healthcheck:
      test: ["CMD", "cast", "client", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 1s

  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erc8004-app
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      - RPC_URL=http://anvil:8545
      - CHAIN_ID=31337
      - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - CREWAI_STORAGE_DIR=/tmp/crewai
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/contracts/lib
      - /app/contracts/out
    ports:
      - "5173:5173"
    networks:
      - erc8004-network
    stdin_open: false
    tty: false
    command: >
      sh -c "rm -f deployment.json data/*.json validations/*.json &&
             echo 'n' | python3 demo.py"

  # Frontend dev server (optional - run separately if needed)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erc8004-frontend
    depends_on:
      - anvil
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    networks:
      - erc8004-network
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    profiles:
      - frontend

networks:
  erc8004-network:
    driver: bridge
